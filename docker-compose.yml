name: 8085-simulator

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - simulator-redis-data:/data
    networks:
      - simulator-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  simulator-redis-data:

networks:
  simulator-network:
    name: 8085-simulator-network
    driver: bridge
